name: Build OpenSw Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout OpenSw
        uses: actions/checkout@v4
        with:
          repository: RemiPelloux/OpenSw
          ref: thor-lab
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 and NDK 28.2
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "ndk;28.2.13676358"

      - name: Build OpenSw Release
        working-directory: src/android
        run: ./gradlew :app:assembleOpenSwRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="src/android/app/build/outputs/apk/openSw/release/app-openSw-release.apk"
          test -f "$APK"
          sha256sum "$APK"
          file "$APK"

      - name: Upload OpenSw APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenSw-Android-Release
          path: src/android/app/build/outputs/apk/openSw/release/app-openSw-release.apk
          if-no-files-found: error
          retention-days: 14
